<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HETDEX PDR1 — Datacube Search</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;background:#f0f4f8;color:#1e293b;line-height:1.5}
a{color:#1d4ed8;text-decoration:none}a:hover{text-decoration:underline}

/* Header */
.site-header{background:linear-gradient(135deg,#0d2240 0%,#1a3a6b 100%);
  color:#fff;padding:8px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
.logo{font-size:1.05rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.logo span{color:#f59e0b}
.subtitle{font-size:.75rem;color:#93c5fd;display:none}
@media(min-width:540px){.subtitle{display:block}}
#status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
  border-radius:20px;font-size:.72rem;font-weight:500;
  background:rgba(255,255,255,.12);color:#e2e8f0;white-space:nowrap}
#status-pill.loading{background:rgba(245,158,11,.2);color:#fcd34d}
#status-pill.ready{background:rgba(5,150,105,.25);color:#6ee7b7}
#status-pill.error{background:rgba(220,38,38,.25);color:#fca5a5}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.dot.spin{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Progress */
#progress-bar-wrap{height:3px;background:#1a3a6b;width:100%}
#progress-bar{height:3px;background:#f59e0b;width:0;transition:width .2s}

/* Layout */
.app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:1fr auto;
  gap:10px;padding:10px;max-width:1440px;margin:0 auto;min-height:calc(100vh - 70px)}
@media(max-width:720px){.app{grid-template-columns:1fr;padding:8px;gap:8px}}

/* Card */
.card{background:#fff;border-radius:8px;border:1px solid #e2e8f0;
  overflow:hidden;display:flex;flex-direction:column}
.card-head{padding:8px 13px;border-bottom:1px solid #e2e8f0;font-weight:600;
  font-size:.78rem;color:#374151;display:flex;align-items:center;
  justify-content:space-between;background:#f8fafc;gap:6px;flex-wrap:wrap}
.card-body{padding:12px;flex:1;overflow:auto}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid #e2e8f0;margin:-12px -12px 12px;overflow-x:auto}
.tab{flex:1;min-width:60px;padding:8px 4px;border:none;background:none;
  font-size:.72rem;font-weight:500;color:#64748b;cursor:pointer;
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap}
.tab:hover{color:#1e293b}
.tab.active{color:#1a3a6b;border-bottom-color:#1a3a6b}

/* Form */
.form-row{display:flex;gap:8px;margin-bottom:9px}
.form-group{margin-bottom:9px;flex:1}
label{display:block;font-size:.73rem;font-weight:500;color:#374151;margin-bottom:3px}
input[type=number],input[type=text],select,textarea{
  width:100%;padding:5px 8px;border:1px solid #cbd5e1;border-radius:6px;
  font-size:.8rem;color:#1e293b;background:#fff;outline:none;
  transition:border-color .15s,box-shadow .15s}
input[type=number]:focus,input[type=text]:focus,select:focus,textarea:focus{
  border-color:#1a3a6b;box-shadow:0 0 0 3px rgba(26,58,107,.1)}
textarea{resize:vertical;min-height:90px;font-family:monospace;font-size:.75rem}
input[type=range]{width:100%;accent-color:#1a3a6b}
.range-row{display:flex;align-items:center;gap:8px}
.range-val{min-width:40px;text-align:right;font-size:.8rem;font-weight:600;color:#1a3a6b}
.hint{font-size:.7rem;color:#94a3b8;margin-top:3px}
.example-link{font-size:.7rem;color:#1d4ed8;cursor:pointer;float:right}
.parse-ok{color:#059669;font-size:.7rem;margin-top:3px}
.parse-err{color:#dc2626;font-size:.7rem}

/* Coordinate format toggle */
.coord-fmt-row{display:flex;align-items:center;gap:5px;margin-top:6px;margin-bottom:9px}
.fmt-pill{padding:2px 10px;border-radius:10px;border:1px solid #cbd5e1;background:#f8fafc;
  color:#374151;font-size:.7rem;font-weight:500;cursor:pointer;transition:all .15s}
.fmt-pill.active{background:#1a3a6b;color:#fff;border-color:#1a3a6b}
.fmt-pill:hover:not(.active){background:#e2e8f0}

/* Lookup status */
.lookup-status{margin-top:6px;padding:7px 10px;border-radius:6px;font-size:.75rem;
  background:#f1f5f9;border:1px solid #e2e8f0;color:#475569}
.lookup-status.ok{background:#dcfce7;border-color:#bbf7d0;color:#166534}
.lookup-status.err{background:#fee2e2;border-color:#fecaca;color:#991b1b}
.lookup-status.loading{background:#fefce8;border-color:#fde68a;color:#92400e}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;
  border-radius:6px;border:none;cursor:pointer;font-size:.8rem;font-weight:500;
  transition:background .15s,box-shadow .15s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:#1a3a6b;color:#fff}
.btn-primary:hover:not(:disabled){background:#0d2240;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.btn-secondary{background:#fff;color:#374151;border:1px solid #cbd5e1}
.btn-secondary:hover:not(:disabled){background:#f1f5f9}
.btn-green{background:#059669;color:#fff}
.btn-green:hover:not(:disabled){background:#047857}
.btn-amber{background:#d97706;color:#fff}
.btn-amber:hover:not(:disabled){background:#b45309}
.btn-sm{padding:3px 8px;font-size:.72rem}
.btn-full{width:100%;justify-content:center;margin-top:5px}
.file-btn-wrap{position:relative;overflow:hidden;display:inline-block}
.file-btn-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Filters row */
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.filters select,.filters input[type=number]{
  padding:3px 6px;font-size:.72rem;min-width:100px;width:auto}
.filter-label{font-size:.7rem;color:#64748b;white-space:nowrap}

/* Results header */
.results-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.result-count{font-size:.82rem;font-weight:600;color:#1e293b}
.result-count span{color:#1a3a6b}
.sel-count{font-size:.75rem;color:#7c3aed;font-weight:500}

/* Table */
.table-wrap{overflow:auto;max-height:calc(100vh - 270px);border-radius:6px;
  border:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;font-size:.76rem}
thead th{position:sticky;top:0;background:#f8fafc;border-bottom:1px solid #e2e8f0;
  padding:6px 8px;text-align:left;font-weight:600;color:#374151;
  white-space:nowrap;user-select:none}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{background:#eff6ff;color:#1a3a6b}
thead th.sorted-asc::after{content:' ↑'}
thead th.sorted-desc::after{content:' ↓'}
tbody tr{border-bottom:1px solid #f1f5f9;transition:background .1s}
tbody tr:hover{background:#f8fafc}
tbody tr.selected{background:#eff6ff}
tbody td{padding:5px 8px;white-space:nowrap}
.td-check{width:28px;text-align:center}
.td-dl a{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;
  background:#eff6ff;color:#1d4ed8;font-size:.7rem;font-weight:500;
  text-decoration:none;border:1px solid #bfdbfe}
.td-dl a:hover{background:#dbeafe}
.td-mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:.75rem}
.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:.68rem;font-weight:600}
.badge-good{background:#dcfce7;color:#15803d}
.badge-bad{background:#fee2e2;color:#b91c1c}
.badge-field{background:#eff6ff;color:#1e40af}
.empty-state{text-align:center;color:#94a3b8;padding:32px 16px;font-size:.82rem}
.empty-state .icon{font-size:2rem;margin-bottom:8px}

/* Download section */
#download-section{grid-column:1/-1;display:none;background:#fff;
  border-radius:8px;border:1px solid #e2e8f0}
#download-section.visible{display:block}
.dl-head{background:#0d2240;color:#e2e8f0;padding:8px 14px;font-size:.78rem;
  font-weight:600;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:10px}
.dl-head .size-est{margin-left:auto;font-weight:400;color:#93c5fd;font-size:.72rem}
.dl-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dl-buttons{display:flex;gap:6px;flex-wrap:wrap}
.code-block{background:#1e293b;color:#e2e8f0;padding:9px 12px;border-radius:6px;
  font-family:'SFMono-Regular',Consolas,monospace;font-size:.72rem;
  overflow-x:auto;line-height:1.7;position:relative}
.code-block .cm{color:#64748b}
.code-block .cd{color:#bae6fd}
.copy-icon{position:absolute;top:7px;right:8px;background:rgba(255,255,255,.1);
  border:none;color:#94a3b8;padding:2px 7px;border-radius:4px;cursor:pointer;font-size:.68rem}
.copy-icon:hover{background:rgba(255,255,255,.2);color:#e2e8f0}

/* Toast */
#copy-toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#1e293b;color:#e2e8f0;padding:5px 16px;border-radius:20px;
  font-size:.78rem;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.3)}
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">HETDEX <span>PDR1</span></div>
  <div id="status-pill"><span class="dot spin"></span><span id="status-text">Loading…</span></div>
  <div class="subtitle">Hobby-Eberly Telescope Dark Energy Experiment</div>
</header>
<div id="progress-bar-wrap"><div id="progress-bar"></div></div>

<div class="app">

  <!-- ── Query panel ─────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-head">Search</div>
    <div class="card-body">

      <div class="tabs">
        <button class="tab active" data-tab="single">Coordinate</button>
        <button class="tab" data-tab="catalog">Catalog</button>
        <button class="tab" data-tab="shotid">Shot ID</button>
        <button class="tab" data-tab="detectid">Detect ID</button>
        <button class="tab" data-tab="sourceid">Source ID</button>
      </div>

      <!-- Single coordinate -->
      <div id="tab-single">
        <div class="form-row">
          <div class="form-group">
            <label>RA <span class="example-link" onclick="loadExample()">Example</span></label>
            <input type="text" id="inp-ra" placeholder="228.78581" value="228.78581">
          </div>
          <div class="form-group">
            <label>Dec</label>
            <input type="text" id="inp-dec" placeholder="51.268036" value="51.268036">
          </div>
        </div>
        <div id="coord-hint" class="hint">Decimal degrees &nbsp;·&nbsp; e.g. 228.78581, 51.268036</div>
        <div class="coord-fmt-row">
          <span class="filter-label">Format:</span>
          <button id="fmt-deg" class="fmt-pill active" onclick="setCoordFormat('deg')">Decimal°</button>
          <button id="fmt-sex" class="fmt-pill" onclick="setCoordFormat('sex')">Sexagesimal</button>
        </div>
        <div class="form-group" style="margin-top:4px;margin-bottom:6px">
          <label>Object name <span style="font-weight:400;color:#94a3b8;font-size:.68rem">— resolves to coordinates via NED/SIMBAD</span></label>
          <div style="display:flex;gap:6px">
            <input type="text" id="inp-coord-name" placeholder="e.g. M101, HETDEX J151508.6+511608.7" style="flex:1">
            <button class="btn btn-secondary btn-sm" onclick="resolveToCoords()">Resolve</button>
          </div>
          <div id="coord-name-status" class="hint" style="min-height:1.1em"></div>
        </div>
        <div class="form-group">
          <label>Search radius</label>
          <div class="range-row">
            <input type="range" id="inp-radius" min="5" max="7200" value="37"
              oninput="document.getElementById('radius-val').textContent=fmtRadius(+this.value)">
            <span class="range-val" id="radius-val">37″</span>
          </div>
          <div class="hint">37″ radius → single IFU (52″×52″ cube) · max 2°</div>
        </div>
        <button class="btn btn-primary btn-full" id="btn-single" onclick="doSingleSearch()" disabled>Search</button>
      </div>

      <!-- Catalog -->
      <div id="tab-catalog" style="display:none">
        <div class="form-group">
          <label>RA, Dec list (one source per line)</label>
          <textarea id="inp-catalog"
            placeholder="228.78581  51.268036&#10;150.23189  2.363963&#10;&#10;Accepts space, comma, or tab. Lines starting with # ignored."></textarea>
          <div id="catalog-status"></div>
          <div class="hint" style="margin-top:5px">or
            <span class="file-btn-wrap">
              <button class="btn btn-secondary btn-sm" style="margin-left:4px">Upload file</button>
              <input type="file" id="inp-file" accept=".csv,.txt,.dat" onchange="loadCatalogFile(event)">
            </span>
          </div>
        </div>
        <button class="btn btn-primary btn-full" id="btn-catalog" onclick="doCatalogSearch()" disabled>Search Catalog</button>
      </div>

      <!-- Shot ID -->
      <div id="tab-shotid" style="display:none">
        <div class="form-group">
          <label>Shotid(s) — one per line or comma-separated</label>
          <textarea id="inp-shotid" placeholder="20190405020&#10;20190406015&#10;&#10;Returns all IFU cubes for the given observation(s)."></textarea>
        </div>
        <button class="btn btn-primary btn-full" id="btn-shotid" onclick="doShotidSearch()" disabled>Search Shotids</button>
      </div>

      <!-- Detect ID -->
      <div id="tab-detectid" style="display:none">
        <div class="form-group">
          <label>Detectid(s) — one per line or comma-separated</label>
          <textarea id="inp-detectid" placeholder="5090068724&#10;2101130000123&#10;&#10;Requires source-lookup.bin (see tools/make_source_lookup.py)."></textarea>
          <div id="detect-lookup-status" class="lookup-status" style="display:none"></div>
        </div>
        <button class="btn btn-primary btn-full" id="btn-detectid" onclick="doDetectidSearch()" disabled>Search Detectids</button>
      </div>

      <!-- Source ID -->
      <div id="tab-sourceid" style="display:none">
        <div class="form-group">
          <label>Source ID(s) — one per line or comma-separated</label>
          <textarea id="inp-sourceid" placeholder="2101130000123&#10;2101130000456&#10;&#10;Requires source-lookup.bin (see tools/make_source_lookup.py)."></textarea>
          <div id="source-lookup-status" class="lookup-status" style="display:none"></div>
        </div>
        <button class="btn btn-primary btn-full" id="btn-sourceid" onclick="doSourceidSearch()" disabled>Search Source IDs</button>
      </div>


    </div><!-- card-body -->
  </div><!-- query card -->

  <!-- ── Results panel ───────────────────────────────────────────── -->
  <div class="card">
    <div class="card-head">
      Results
      <div class="filters" id="filter-group" style="display:none">
        <select id="filter-quality" onchange="applyFilters()">
          <option value="all">All quality</option>
          <option value="good">Good (flag=1)</option>
        </select>
        <select id="filter-field" onchange="applyFilters()">
          <option value="all">All fields</option>
          <option value="dex-spring">dex-spring</option>
          <option value="dex-fall">dex-fall</option>
          <option value="cosmos">cosmos</option>
          <option value="goods-n">goods-n</option>
          <option value="nep">nep</option>
          <option value="ssa22">ssa22</option>
        </select>
        <span class="filter-label">Seeing≤</span>
        <input type="number" id="filter-fwhm" placeholder="—" min="1.2" max="10" step="0.1"
          value="3.2" style="width:58px" onchange="applyFilters()" title="Max seeing FWHM (arcsec)">
        <span class="filter-label">" Resp≥</span>
        <input type="number" id="filter-resp" placeholder="—" min="0.08" max="0.6" step="0.01"
          value="0.08" style="width:52px" onchange="applyFilters()" title="Min response_4540">
      </div>
    </div>
    <div class="card-body">
      <div class="results-head" id="results-head" style="display:none">
        <span class="result-count" id="result-count"></span>
        <span class="sel-count" id="sel-count" style="display:none"></span>
      </div>
      <div id="results-empty" class="empty-state">
        <div class="icon">🔭</div>
        Enter coordinates and click Search
      </div>
      <div class="table-wrap" id="table-wrap" style="display:none">
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ── Download section ───────────────────────────────────────── -->
  <div id="download-section">
    <div class="dl-head">
      Download Datacubes
      <span class="size-est" id="size-est"></span>
    </div>
    <div class="dl-body">
      <div class="coord-fmt-row" style="margin-bottom:8px">
        <span class="filter-label">Server:</span>
        <button id="mirror-tacc" class="fmt-pill active" onclick="setMirror(0)"
          title="TACC Corral, Texas — primary">TACC</button>
        <button id="mirror-mpe"  class="fmt-pill"        onclick="setMirror(1)"
          title="MPE SciServer, Germany — mirror">MPE mirror</button>
      </div>
      <div class="dl-buttons">
        <button class="btn btn-green" id="btn-dl-selected" onclick="downloadSelected()" style="display:none">
          ⬇ Download selected (<span id="sel-dl-count">0</span>)
        </button>
        <button class="btn btn-green" onclick="downloadAll()">⬇ Download all (urls.txt)</button>
        <button class="btn btn-amber" onclick="downloadRegionFile()">⬡ DS9 region file</button>
        <button class="btn btn-secondary" onclick="copyURLs()">⎘ Copy URLs</button>
      </div>
      <div class="code-block" id="wget-block">
        <button class="copy-icon" onclick="copyWget()">copy</button>
        <span id="wget-text"></span>
      </div>
    </div>
  </div>

</div><!-- .app -->
<div id="copy-toast">Copied!</div>

<script>
// ── Constants ────────────────────────────────────────────────────────
const IFU_DATA_URL    = 'ifu-data.bin';
const SOURCE_LOOKUP_URL = 'source-lookup.bin';
const CUBE_BASE_URL   = 'https://web.corral.tacc.utexas.edu/hetdex/HETDEX/pdr/pdr1/datacubes';
const CUBE_MIRROR_URL = 'https://data.sciserver.mpe.mpg.de/public/hetdex/pdr/pdr1/datacubes';
const FIELD_NAMES     = ['dex-spring','dex-fall','cosmos','goods-n','nep','ssa22'];
const FIELD_COLORS    = ['cyan','blue','magenta','yellow','green','red']; // DS9 colours
const CUBE_SIZE_GB    = 0.019;
const IFU_RADIUS_ARCSEC = 26;
const MAX_ROWS        = 1000;

// ── IFU data state ───────────────────────────────────────────────────
let N = 0;
let raArr, decArr, shotDateArr, shotObsArr, ifuslotArr, flagArr, fieldArr, fwhmArr, respArr;
let isLoaded = false;

// ── Source lookup state ──────────────────────────────────────────────
let SN = 0;
let slSrcIdLo, slSrcIdHi, slDetIdLo, slDetIdHi;
let slRa, slDec, slShotDate, slShotObs, slIfuslot;
let sourceIdMap = null, detectIdMap = null;
let slLoaded = false, slLoading = false;

// ── UI state ─────────────────────────────────────────────────────────
let useSexa     = false;
let activeMirror = CUBE_BASE_URL;
let rawResults  = [];
let activeMode  = 'single';
let sortCol     = null, sortAsc = true;
let selectedKeys = new Set();

// ── Radius display helper ─────────────────────────────────────────────
function fmtRadius(arcsec) {
  if (arcsec >= 3600) return (arcsec/3600).toFixed(2).replace(/\.?0+$/,'') + '°';
  if (arcsec >= 60)   return (arcsec/60).toFixed(1).replace(/\.?0+$/,'')  + '′';
  return arcsec + '″';
}

// ── Coordinate utilities ─────────────────────────────────────────────
function raToHMS(ra) {
  const h  = ra / 15;
  const hh = Math.floor(h);
  const m  = (h - hh) * 60;
  const mm = Math.floor(m);
  const ss = (m - mm) * 60;
  return `${pad2(hh)}:${pad2(mm)}:${ss.toFixed(1).padStart(4,'0')}`;
}
function decToDMS(dec) {
  const sign = dec < 0 ? '−' : '+';
  const a  = Math.abs(dec);
  const dd = Math.floor(a);
  const m  = (a - dd) * 60;
  const mm = Math.floor(m);
  const ss = (m - mm) * 60;
  return `${sign}${pad2(dd)}:${pad2(mm)}:${ss.toFixed(1).padStart(4,'0')}`;
}
function pad2(n) { return String(n).padStart(2,'0'); }
function fmtRA(ra)   { return useSexa ? raToHMS(ra)  : ra.toFixed(5); }
function fmtDec(dec) { return useSexa ? decToDMS(dec): dec.toFixed(5); }

function parseRA(s) {
  s = s.trim();
  if (/[hH:]/.test(s)) {
    const p = s.replace(/[hHmMsS°]/g,' ').trim().split(/[\s:]+/);
    return (parseFloat(p[0]||0) + parseFloat(p[1]||0)/60 + parseFloat(p[2]||0)/3600) * 15;
  }
  return parseFloat(s);
}
function parseDec(s) {
  s = s.trim();
  if (/[dD°:]/.test(s) || (s.includes(':') && !s.includes('.'))) {
    const sign = s.startsWith('-') ? -1 : 1;
    const p = s.replace(/[+\-dDmMsS°]/g,' ').trim().split(/[\s:]+/);
    return sign * (parseFloat(p[0]||0) + parseFloat(p[1]||0)/60 + parseFloat(p[2]||0)/3600);
  }
  return parseFloat(s);
}

function setCoordFormat(mode) {
  useSexa = mode === 'sex';
  document.getElementById('fmt-deg').classList.toggle('active', !useSexa);
  document.getElementById('fmt-sex').classList.toggle('active', useSexa);
  const raIn  = document.getElementById('inp-ra');
  const decIn = document.getElementById('inp-dec');
  // Convert existing values to the new format
  const ra  = parseRA(raIn.value);
  const dec = parseDec(decIn.value);
  if (!isNaN(ra) && !isNaN(dec)) {
    raIn.value  = useSexa ? raToHMS(ra)   : ra.toFixed(5);
    decIn.value = useSexa ? decToDMS(dec) : dec.toFixed(5);
  }
  if (useSexa) {
    raIn.placeholder  = '15:15:08.6';
    decIn.placeholder = '+51:16:04.9';
    document.getElementById('coord-hint').textContent =
      'Sexagesimal · e.g. 15:15:08.6, +51:16:04.9';
  } else {
    raIn.placeholder  = '228.78581';
    decIn.placeholder = '51.268036';
    document.getElementById('coord-hint').textContent =
      'Decimal degrees · e.g. 228.78581, 51.268036';
  }
  if (rawResults.length) applyFilters();
}

// ── Data loading — IFU index ─────────────────────────────────────────
async function loadIFUData() {
  setStatus('loading','Loading IFU index…');
  try {
    const resp = await fetch(IFU_DATA_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} — ifu-data.bin not found`);
    const total  = parseInt(resp.headers.get('Content-Length')||'0');
    const reader = resp.body.getReader();
    const chunks = []; let rcv = 0;
    while (true) {
      const {done,value} = await reader.read();
      if (done) break;
      chunks.push(value); rcv += value.length;
      if (total > 0) {
        document.getElementById('progress-bar').style.width =
          Math.min(100,(rcv/total)*100)+'%';
        setStatus('loading',`Loading… ${(rcv/1e6).toFixed(1)} / ${(total/1e6).toFixed(1)} MB`);
      }
    }
    const buf = new Uint8Array(rcv); let pos=0;
    for (const c of chunks){buf.set(c,pos);pos+=c.length;}
    parseIFUBuffer(buf.buffer);
    document.getElementById('progress-bar').style.width='0';
    setStatus('ready',`Ready — ${N.toLocaleString()} IFUs`);
    isLoaded = true;
    enablePrimaryButtons();
  } catch(e) {
    setStatus('error', e.message);
    document.getElementById('results-empty').innerHTML =
      `<div class="icon">⚠️</div>Could not load <code>ifu-data.bin</code>.<br>
       <span style="font-size:.72rem;color:#64748b">Run:
       <code>python tools/make_ifu_web_data.py ifu-index.fits ifu-data.bin</code>
       then upload to this directory.</span>`;
  }
}

function parseIFUBuffer(buf) {
  const v = new DataView(buf);
  N = v.getUint32(8,true);
  let o = 16;
  raArr      = new Float32Array(buf,o,N); o+=N*4;
  decArr     = new Float32Array(buf,o,N); o+=N*4;
  shotDateArr= new Uint32Array (buf,o,N); o+=N*4;
  shotObsArr = new Uint16Array (buf,o,N); o+=N*2;
  ifuslotArr = new Uint16Array (buf,o,N); o+=N*2;
  flagArr    = new Uint8Array  (buf,o,N); o+=N;
  fieldArr   = new Uint8Array  (buf,o,N); o+=N;
  fwhmArr    = new Uint8Array  (buf,o,N); o+=N;
  respArr    = new Uint8Array  (buf,o,N);
}

function enablePrimaryButtons() {
  ['btn-single','btn-catalog','btn-shotid'].forEach(id=>{
    document.getElementById(id).disabled = false;
  });
}

// ── Data loading — source lookup (lazy) ──────────────────────────────
async function loadSourceLookup(statusId) {
  if (slLoaded) return true;
  if (slLoading) return false;
  slLoading = true;
  const el = document.getElementById(statusId);
  el.style.display='block';
  el.className='lookup-status loading';
  el.textContent='Loading source-lookup.bin…';
  try {
    const resp = await fetch(SOURCE_LOOKUP_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const total  = parseInt(resp.headers.get('Content-Length')||'0');
    const reader = resp.body.getReader();
    const chunks=[]; let rcv=0;
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      chunks.push(value);rcv+=value.length;
      if(total>0) el.textContent=`Loading… ${(rcv/1e6).toFixed(0)} / ${(total/1e6).toFixed(0)} MB`;
    }
    const buf=new Uint8Array(rcv);let pos=0;
    for(const c of chunks){buf.set(c,pos);pos+=c.length;}
    parseSourceBuffer(buf.buffer);
    buildSourceMaps();
    slLoaded=true; slLoading=false;
    el.className='lookup-status ok';
    el.textContent=`Loaded — ${SN.toLocaleString()} sources`;
    document.getElementById('btn-detectid').disabled=false;
    document.getElementById('btn-sourceid').disabled=false;
    return true;
  } catch(e) {
    slLoading=false;
    el.className='lookup-status err';
    el.textContent=`Failed: ${e.message}. Generate with tools/make_source_lookup.py`;
    return false;
  }
}

function parseSourceBuffer(buf) {
  const v=new DataView(buf);
  SN=v.getUint32(8,true);
  let o=16;
  slSrcIdLo = new Uint32Array(buf,o,SN); o+=SN*4;
  slSrcIdHi = new Uint32Array(buf,o,SN); o+=SN*4;
  slDetIdLo = new Uint32Array(buf,o,SN); o+=SN*4;
  slDetIdHi = new Uint32Array(buf,o,SN); o+=SN*4;
  slRa       = new Float32Array(buf,o,SN); o+=SN*4;
  slDec      = new Float32Array(buf,o,SN); o+=SN*4;
  slShotDate = new Uint32Array(buf,o,SN); o+=SN*4;
  slShotObs  = new Uint16Array(buf,o,SN); o+=SN*2;
  slIfuslot  = new Uint16Array(buf,o,SN);
}

function buildSourceMaps() {
  sourceIdMap = new Map();
  detectIdMap = new Map();
  for (let i=0;i<SN;i++) {
    const sl=slSrcIdLo[i];
    if(!sourceIdMap.has(sl)) sourceIdMap.set(sl,[]);
    sourceIdMap.get(sl).push(i);
    const dl=slDetIdLo[i];
    if(!detectIdMap.has(dl)) detectIdMap.set(dl,[]);
    detectIdMap.get(dl).push(i);
  }
}

// ── Spatial search helpers ────────────────────────────────────────────
function bsLower(arr,val){
  let lo=0,hi=arr.length;
  while(lo<hi){const m=(lo+hi)>>>1;arr[m]<val?lo=m+1:hi=m;}return lo;
}
function bsUpper(arr,val){
  let lo=0,hi=arr.length;
  while(lo<hi){const m=(lo+hi)>>>1;arr[m]<=val?lo=m+1:hi=m;}return lo;
}
function angSepArcsec(ra1,dec1,ra2,dec2){
  const d=Math.PI/180;
  const sd=Math.sin((dec1-dec2)*d/2),sr=Math.sin((ra1-ra2)*d/2);
  const a=sd*sd+Math.cos(dec1*d)*Math.cos(dec2*d)*sr*sr;
  return 2*Math.asin(Math.sqrt(Math.min(1,a)))*3600/d;
}

function coneSearch(ra0,dec0,rArc){
  const rDeg=rArc/3600;
  const s=bsLower(decArr,dec0-rDeg), e=bsUpper(decArr,dec0+rDeg);
  const cosDec=Math.max(Math.cos(dec0*Math.PI/180),1e-4);
  const raW=rDeg/cosDec*1.05;
  const hits=[];
  for(let i=s;i<e;i++){
    let dra=Math.abs(raArr[i]-ra0);if(dra>180)dra=360-dra;
    if(dra>raW)continue;
    const sep=angSepArcsec(raArr[i],decArr[i],ra0,dec0);
    if(sep<=rArc) hits.push(makeHit(i,sep));
  }
  return hits;
}

function makeHit(i, sep, extra){
  return {
    i, sep: sep||0,
    ra: raArr[i], dec: decArr[i],
    shotid: shotDateArr[i]*1000+shotObsArr[i],
    ifuslot: String(ifuslotArr[i]).padStart(3,'0'),
    flag: flagArr[i],
    field: FIELD_NAMES[fieldArr[i]]||'other',
    fwhm: fwhmArr[i]/10,
    resp: respArr[i]/100,
    ...extra
  };
}

function parseCatalog(text){
  const lines=text.split('\n'), sources=[], errors=[];
  for(let ln of lines){
    ln=ln.trim();
    if(!ln||ln.startsWith('#'))continue;
    const p=ln.split(/[\s,\t]+/).filter(Boolean);
    if(p.length<2){errors.push(ln);continue;}
    const ra=parseRA(p[0]),dec=parseDec(p[1]);
    if(isNaN(ra)||isNaN(dec)||ra<0||ra>360||dec<-90||dec>90){errors.push(ln);continue;}
    sources.push({ra,dec});
  }
  return{sources,errors};
}

function catalogConeSearch(sources,rArc){
  const cubeMap=new Map();
  for(let si=0;si<sources.length;si++){
    const{ra,dec}=sources[si];
    for(const h of coneSearch(ra,dec,rArc)){
      const key=`${h.shotid}_${h.ifuslot}`;
      if(!cubeMap.has(key)) cubeMap.set(key,{...h,nSrc:0,minSep:Infinity});
      const e=cubeMap.get(key);
      e.nSrc++;
      if(h.sep<e.minSep)e.minSep=h.sep;
    }
  }
  return Array.from(cubeMap.values());
}

// ── Shotid search ─────────────────────────────────────────────────────
function shotidToResults(shotids){
  const set=new Set(shotids.map(Number).filter(n=>!isNaN(n)));
  const hits=[];
  for(let i=0;i<N;i++){
    const shot=shotDateArr[i]*1000+shotObsArr[i];
    if(set.has(shot)) hits.push(makeHit(i,0));
  }
  return hits;
}

// ── Source/detect ID search ───────────────────────────────────────────
function parseId64(s){
  try{
    const n=BigInt(s.trim());
    return{lo:Number(n&0xFFFFFFFFn),hi:Number((n>>32n)&0xFFFFFFFFn)};
  }catch{return null;}
}

function lookupByDetectId(ids){
  const results=[];
  const seen=new Set();
  for(const id of ids){
    const p=parseId64(id);if(!p)continue;
    const candidates=detectIdMap.get(p.lo)||[];
    for(const i of candidates){
      if(slDetIdHi[i]!==p.hi)continue;
      const shotid=slShotDate[i]*1000+slShotObs[i];
      const ifuslot=String(slIfuslot[i]).padStart(3,'0');
      const key=`${shotid}_${ifuslot}`;
      if(seen.has(key))continue; seen.add(key);
      // Find matching row in ifu data for quality info
      const hit=findIFURow(shotid,ifuslot,slRa[i],slDec[i]);
      results.push(hit);
    }
  }
  return results;
}

function lookupBySourceId(ids){
  const results=[];
  const seen=new Set();
  for(const id of ids){
    const p=parseId64(id);if(!p)continue;
    const candidates=sourceIdMap.get(p.lo)||[];
    for(const i of candidates){
      if(slSrcIdHi[i]!==p.hi)continue;
      const shotid=slShotDate[i]*1000+slShotObs[i];
      const ifuslot=String(slIfuslot[i]).padStart(3,'0');
      const key=`${shotid}_${ifuslot}`;
      if(seen.has(key))continue; seen.add(key);
      const hit=findIFURow(shotid,ifuslot,slRa[i],slDec[i]);
      results.push(hit);
    }
  }
  return results;
}

function findIFURow(shotid,ifuslot,ra,dec){
  // Search ifu-data for the matching shotid+ifuslot to get quality columns.
  // Fall back to source catalog ra/dec if ifu row not found.
  const date=(shotid/1000)|0, obs=shotid%1000;
  const ifuNum=parseInt(ifuslot);
  for(let i=0;i<N;i++){
    if(shotDateArr[i]===date&&shotObsArr[i]===obs&&ifuslotArr[i]===ifuNum)
      return makeHit(i,0);
  }
  // Fallback — cube may be flagged/missing in ifu-data
  return{i:-1,sep:0,ra,dec,shotid,ifuslot,flag:0,field:'unknown',fwhm:0,resp:0};
}

function doSingleSearch(){

// ── Filtering & sorting ───────────────────────────────────────────────
function applyFilters(){
  const qf=document.getElementById('filter-quality').value;
  const ff=document.getElementById('filter-field').value;
  const fwEl=document.getElementById('filter-fwhm');
  let fw=parseFloat(fwEl.value);
  if(!isNaN(fw)&&fw<1.2){fw=1.2;fwEl.value='1.2';}
  const frEl=document.getElementById('filter-resp');
  let fr=parseFloat(frEl.value);
  if(!isNaN(fr)&&fr<0.08){fr=0.08;frEl.value='0.08';}
  if(!isNaN(fr)&&fr>0.6) {fr=0.6; frEl.value='0.6'; }
  let hits=rawResults;
  if(qf==='good')  hits=hits.filter(h=>h.flag===1);
  if(ff!=='all')   hits=hits.filter(h=>h.field===ff);
  if(!isNaN(fw))   hits=hits.filter(h=>h.fwhm<=fw);
  if(!isNaN(fr))   hits=hits.filter(h=>h.resp>=fr);
  if(sortCol)      hits=sortBy(hits,sortCol,sortAsc);
  renderResults(hits);
}

function sortBy(arr,col,asc){
  return[...arr].sort((a,b)=>{
    const va=a[col],vb=b[col];
    return asc?(va>vb?1:va<vb?-1:0):(va<vb?1:va>vb?-1:0);
  });
}

function onHeaderClick(col){
  if(sortCol===col)sortAsc=!sortAsc;
  else{sortCol=col;sortAsc=true;}
  document.querySelectorAll('thead th').forEach(th=>{
    th.classList.remove('sorted-asc','sorted-desc');
    if(th.dataset.col===col)th.classList.add(sortAsc?'sorted-asc':'sorted-desc');
  });
  applyFilters();
}

// ── Checkbox management ───────────────────────────────────────────────
function hitKey(h){return `${h.shotid}_${h.ifuslot}`;}

function toggleSelectAll(checked){
  const rows=document.querySelectorAll('#table-body tr');
  rows.forEach(tr=>{
    const key=tr.dataset.key;
    if(!key)return;
    const cb=tr.querySelector('input[type=checkbox]');
    if(cb)cb.checked=checked;
    checked?selectedKeys.add(key):selectedKeys.delete(key);
    tr.classList.toggle('selected',checked);
  });
  updateSelUI();
}

function toggleRow(key,checked,tr){
  checked?selectedKeys.add(key):selectedKeys.delete(key);
  tr.classList.toggle('selected',checked);
  updateSelUI();
}

function updateSelUI(){
  const n=selectedKeys.size;
  const sc=document.getElementById('sel-count');
  const bd=document.getElementById('btn-dl-selected');
  const sd=document.getElementById('sel-dl-count');
  if(n>0){
    sc.style.display='';sc.textContent=`${n} selected`;
    bd.style.display='';sd.textContent=n;
  }else{
    sc.style.display='none';
    bd.style.display='none';
  }
  // Update master checkbox indeterminate state
  const rows=document.querySelectorAll('#table-body tr[data-key]');
  const master=document.getElementById('master-cb');
  if(!master||!rows.length)return;
  const nChecked=Array.from(rows).filter(r=>selectedKeys.has(r.dataset.key)).length;
  master.indeterminate=nChecked>0&&nChecked<rows.length;
  master.checked=nChecked===rows.length;
}

// ── Rendering ─────────────────────────────────────────────────────────
function renderResults(hits){
  const isEmpty =document.getElementById('results-empty');
  const wrap    =document.getElementById('table-wrap');
  const head    =document.getElementById('results-head');
  const fg      =document.getElementById('filter-group');
  const countEl =document.getElementById('result-count');
  const dlSec   =document.getElementById('download-section');

  if(!hits.length){
    isEmpty.style.display='';wrap.style.display='none';
    head.style.display='none';fg.style.display='none';
    dlSec.classList.remove('visible');return;
  }

  isEmpty.style.display='none';wrap.style.display='block';
  head.style.display='flex';fg.style.display='flex';

  const shown=Math.min(hits.length,MAX_ROWS);
  const extra=hits.length>MAX_ROWS
    ? ` <span style="font-weight:400;color:#94a3b8">(showing first ${MAX_ROWS.toLocaleString()})</span>` : '';
  countEl.innerHTML=`<span>${hits.length.toLocaleString()}</span> cube${hits.length===1?'':'s'}${extra}`;

  const isCat =activeMode==='catalog';
  const hasSep=activeMode==='single';

  // Build header
  const colDefs=[
    {label:'',col:null,cls:'td-check'},
    {label:'#',col:null},
    {label:'Shotid',col:'shotid',sort:true},
    {label:'IFU',col:'ifuslot',sort:true},
    {label:'Field',col:'field',sort:true},
    {label:'Quality',col:'flag',sort:true},
    {label:'Seeing″',col:'fwhm',sort:true},
    {label:'Resp.',col:'resp',sort:true},
    {label:'RA',col:'ra',sort:true},
    {label:'Dec',col:'dec',sort:true},
    ...(hasSep?[{label:'Sep.′',col:'sep',sort:true}]:[]),
    ...(isCat ?[{label:'Sources',col:'nSrc',sort:true}]:[]),
    {label:'',col:null},
  ];

  const thead=document.getElementById('table-head');
  thead.innerHTML='<tr>'+colDefs.map((c,ci)=>{
    if(ci===0) return `<th class="td-check"><input type="checkbox" id="master-cb"
      onchange="toggleSelectAll(this.checked)"></th>`;
    const sortCls=c.sort?'sortable':'';
    const activeCls=sortCol===c.col?(sortAsc?' sorted-asc':' sorted-desc'):'';
    const click=c.sort?`onclick="onHeaderClick('${c.col}')"`:c.col?'':``;
    return `<th class="${sortCls}${activeCls}" data-col="${c.col||''}" ${click}>${c.label}</th>`;
  }).join('')+'</tr>';

  const rows=hits.slice(0,shown);
  const tbody=document.getElementById('table-body');
  tbody.innerHTML=rows.map((h,idx)=>{
    const key=hitKey(h);
    const sel=selectedKeys.has(key);
    const url=cubeURL(h.shotid,h.ifuslot);
    const flagBadge=h.flag===1
      ?`<span class="badge badge-good">good</span>`
      :`<span class="badge badge-bad">flagged</span>`;
    const fieldBadge=`<span class="badge badge-field">${h.field}</span>`;
    const extraCol=hasSep?`<td>${(h.sep/60).toFixed(3)}</td>`
                  :isCat ?`<td>${h.nSrc}</td>`:'';
    return `<tr data-key="${key}" class="${sel?'selected':''}" onclick="rowClick(event,this,'${key}')">
      <td class="td-check" onclick="event.stopPropagation()">
        <input type="checkbox" ${sel?'checked':''} onchange="toggleRow('${key}',this.checked,this.closest('tr'))">
      </td>
      <td>${idx+1}</td>
      <td class="td-mono">${h.shotid}</td>
      <td>${h.ifuslot}</td>
      <td>${fieldBadge}</td>
      <td>${flagBadge}</td>
      <td>${h.fwhm.toFixed(1)}</td>
      <td>${h.resp.toFixed(2)}</td>
      <td class="td-mono">${fmtRA(h.ra)}</td>
      <td class="td-mono">${fmtDec(h.dec)}</td>
      ${extraCol}
      <td class="td-dl"><a href="${url}" target="_blank" rel="noopener">FITS↗</a></td>
    </tr>`;
  }).join('');

  const totalGB=(hits.length*CUBE_SIZE_GB).toFixed(1);
  document.getElementById('size-est').textContent=
    `${hits.length.toLocaleString()} cubes · ~${totalGB} GB`;
  buildWgetBlock(hits.length);
  dlSec.classList.add('visible');
  updateSelUI();
}

function rowClick(e,tr,key){
  if(e.target.tagName==='INPUT'||e.target.tagName==='A')return;
  const cb=tr.querySelector('input[type=checkbox]');
  if(cb){cb.checked=!cb.checked;toggleRow(key,cb.checked,tr);}
}

// ── Download helpers ──────────────────────────────────────────────────
function cubeURL(shotid,ifuslot){
  return `${activeMirror}/${shotid}/dex_cube_${shotid}_${ifuslot}.fits`;
}

function setMirror(idx){
  activeMirror = idx===0 ? CUBE_BASE_URL : CUBE_MIRROR_URL;
  document.getElementById('mirror-tacc').classList.toggle('active', idx===0);
  document.getElementById('mirror-mpe').classList.toggle('active', idx===1);
  if(rawResults.length) applyFilters();
}

function getFilteredHits(){
  const qf=document.getElementById('filter-quality').value;
  const ff=document.getElementById('filter-field').value;
  const fw=parseFloat(document.getElementById('filter-fwhm').value);
  const fr=parseFloat(document.getElementById('filter-resp').value);
  let hits=rawResults;
  if(qf==='good') hits=hits.filter(h=>h.flag===1);
  if(ff!=='all')  hits=hits.filter(h=>h.field===ff);
  if(!isNaN(fw))  hits=hits.filter(h=>h.fwhm<=fw);
  if(!isNaN(fr))  hits=hits.filter(h=>h.resp>=fr);
  return hits;
}

function triggerDownload(text,filename){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
  a.download=filename;a.click();URL.revokeObjectURL(a.href);
}

function downloadSelected(){
  const hits=getFilteredHits().filter(h=>selectedKeys.has(hitKey(h)));
  if(!hits.length){showToast('No cubes selected');return;}
  triggerDownload(hits.map(h=>cubeURL(h.shotid,h.ifuslot)).join('\n'),'urls_selected.txt');
}

function downloadAll(){
  const hits=getFilteredHits();
  if(!hits.length)return;
  triggerDownload(hits.map(h=>cubeURL(h.shotid,h.ifuslot)).join('\n'),'urls.txt');
}

function downloadRegionFile(){
  const hits=getFilteredHits();
  if(!hits.length)return;
  const lines=[
    '# Region file format: DS9 version 4.1',
    'global width=1 font="helvetica 9 normal roman" select=1 highlite=1',
    'fk5',
    ...hits.map(h=>{
      const color=h.flag===1?'green':'red';
      return `circle(${h.ra.toFixed(5)},${h.dec.toFixed(5)},${IFU_RADIUS_ARCSEC}") `+
             `# text={${h.shotid}_${h.ifuslot} ${h.field}} color=${color}`;
    })
  ];
  triggerDownload(lines.join('\n'),'hetdex_cubes.reg');
}

// ── Name resolver — fills RA/Dec inputs in Coordinate tab ────────────
// ── Name resolver — fills RA/Dec inputs via SIMBAD TAP ───────────────
async function resolveToCoords() {
  const name = document.getElementById('inp-coord-name').value.trim();
  if (!name) return;
  const status = document.getElementById('coord-name-status');
  status.style.color = '';
  status.textContent = 'Resolving…';
  try {
    const safeN = name.replace(/'/g, "''");
    const query = `SELECT ra,dec FROM basic JOIN ident ON oidref=oid WHERE id='${safeN}'`;
    const url   = 'https://simbad.u-strasbg.fr/simbad/sim-tap/sync?REQUEST=doQuery&LANG=ADQL&FORMAT=json&QUERY='
                  + encodeURIComponent(query);
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (!data.data || !data.data.length) {
      status.textContent = 'Not found in SIMBAD. Try full name (e.g. "NGC 5457" for M101).';
      return;
    }
    const [ra, dec] = data.data[0];
    document.getElementById('inp-ra').value  = useSexa ? raToHMS(ra)   : ra.toFixed(5);
    document.getElementById('inp-dec').value = useSexa ? decToDMS(dec) : dec.toFixed(5);
    status.style.color = '#059669';
    status.textContent = ra.toFixed(5) + ', ' + dec.toFixed(5);
  } catch(e) {
    status.textContent = 'Error: ' + e.message;
  }
}

// ── Tab switching ─────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const t=btn.dataset.tab;
    ['single','catalog','shotid','detectid','sourceid'].forEach(id=>{
      document.getElementById('tab-'+id).style.display=t===id?'':'none';
    });
    // Trigger source lookup load when tab is first opened
    if((t==='detectid'||t==='sourceid')&&!slLoaded&&!slLoading){
      const statusId=t==='detectid'?'detect-lookup-status':'source-lookup-status';
      loadSourceLookup(statusId);
    }
  });
});

// ── Catalog live parse count ──────────────────────────────────────────
document.getElementById('inp-catalog').addEventListener('input',function(){
  if(!this.value.trim()){document.getElementById('catalog-status').innerHTML='';return;}
  const{sources,errors}=parseCatalog(this.value);
  updateCatalogStatus(sources.length,errors.length);
});

// ── Catalog file upload ───────────────────────────────────────────────
function loadCatalogFile(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    document.getElementById('inp-catalog').value=ev.target.result;
    const{sources,errors}=parseCatalog(ev.target.result);
    updateCatalogStatus(sources.length,errors.length);
  };
  reader.readAsText(file);
}

});
document.getElementById('inp-coord-name').addEventListener('keydown',e=>{
  if(e.key==='Enter') resolveToCoords();
