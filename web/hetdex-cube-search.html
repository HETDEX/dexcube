<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HETDEX PDR1 — Datacube Cone Search</title>
<style>
/* ── Reset & base ─────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;background:#f0f4f8;color:#1e293b;line-height:1.5}
a{color:#1d4ed8;text-decoration:none}
a:hover{text-decoration:underline}

/* ── Header ───────────────────────────────────────────────────────── */
.site-header{
  background:linear-gradient(135deg,#0d2240 0%,#1a3a6b 100%);
  color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.35)
}
.site-header .logo{font-size:1.05rem;font-weight:700;letter-spacing:.02em;
  white-space:nowrap}
.site-header .logo span{color:#f59e0b}
.site-header .subtitle{font-size:.8rem;color:#93c5fd;margin-left:auto;
  white-space:nowrap;display:none}
@media(min-width:520px){.site-header .subtitle{display:block}}
#status-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:500;
  background:rgba(255,255,255,.12);color:#e2e8f0;white-space:nowrap
}
#status-pill.loading{background:rgba(245,158,11,.2);color:#fcd34d}
#status-pill.ready  {background:rgba(5,150,105,.25);color:#6ee7b7}
#status-pill.error  {background:rgba(220,38,38,.25);color:#fca5a5}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.dot.spin{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Progress bar ─────────────────────────────────────────────────── */
#progress-bar-wrap{height:3px;background:#1a3a6b;width:100%}
#progress-bar{height:3px;background:#f59e0b;width:0;transition:width .2s}

/* ── App layout ───────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:330px 1fr;grid-template-rows:1fr auto;
  gap:12px;padding:12px;max-width:1400px;margin:0 auto;min-height:calc(100vh - 80px)}
@media(max-width:760px){
  .app{grid-template-columns:1fr;padding:8px;gap:8px}
}

/* ── Card ─────────────────────────────────────────────────────────── */
.card{background:#fff;border-radius:8px;border:1px solid #e2e8f0;
  overflow:hidden;display:flex;flex-direction:column}
.card-head{padding:9px 14px;border-bottom:1px solid #e2e8f0;
  font-weight:600;font-size:.8rem;color:#374151;
  display:flex;align-items:center;justify-content:space-between;
  background:#f8fafc}
.card-body{padding:14px;flex:1;overflow:auto}

/* ── Tabs ─────────────────────────────────────────────────────────── */
.tabs{display:flex;border-bottom:1px solid #e2e8f0;margin:-14px -14px 14px}
.tab{flex:1;padding:9px 0;border:none;background:none;font-size:.8rem;
  font-weight:500;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s}
.tab:hover{color:#1e293b}
.tab.active{color:#1a3a6b;border-bottom-color:#1a3a6b}

/* ── Form elements ────────────────────────────────────────────────── */
.form-row{display:flex;gap:8px;margin-bottom:10px}
.form-group{margin-bottom:10px;flex:1}
label{display:block;font-size:.75rem;font-weight:500;color:#374151;margin-bottom:3px}
input[type=number],select,textarea{
  width:100%;padding:6px 9px;border:1px solid #cbd5e1;border-radius:6px;
  font-size:.82rem;color:#1e293b;background:#fff;outline:none;
  transition:border-color .15s,box-shadow .15s}
input[type=number]:focus,select:focus,textarea:focus{
  border-color:#1a3a6b;box-shadow:0 0 0 3px rgba(26,58,107,.12)}
textarea{resize:vertical;min-height:110px;font-family:monospace;font-size:.78rem}
input[type=range]{width:100%;accent-color:#1a3a6b}
.range-row{display:flex;align-items:center;gap:8px}
.range-val{min-width:44px;text-align:right;font-size:.82rem;font-weight:600;
  color:#1a3a6b}
.hint{font-size:.72rem;color:#94a3b8;margin-top:3px}
.parse-ok{color:#059669;font-size:.72rem;margin-top:4px}
.parse-err{color:#dc2626;font-size:.72rem;margin-top:4px}
.example-link{font-size:.72rem;color:#1d4ed8;cursor:pointer;
  float:right;margin-top:-1px}

/* ── Buttons ──────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;
  border-radius:6px;border:none;cursor:pointer;font-size:.82rem;font-weight:500;
  transition:background .15s,box-shadow .15s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#1a3a6b;color:#fff}
.btn-primary:hover:not(:disabled){background:#0d2240;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.btn-secondary{background:#fff;color:#374151;border:1px solid #cbd5e1}
.btn-secondary:hover:not(:disabled){background:#f1f5f9}
.btn-green{background:#059669;color:#fff}
.btn-green:hover:not(:disabled){background:#047857}
.btn-sm{padding:4px 9px;font-size:.75rem}
.btn-full{width:100%;justify-content:center;margin-top:6px}
.file-btn-wrap{position:relative;overflow:hidden;display:inline-block}
.file-btn-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ── Results header ───────────────────────────────────────────────── */
.results-head{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px
}
.result-count{font-size:.85rem;font-weight:600;color:#1e293b}
.result-count span{color:#1a3a6b}
.filter-group{display:flex;align-items:center;gap:6px;margin-left:auto}
.filter-group select{padding:4px 7px;font-size:.75rem;min-width:110px}

/* ── Table ────────────────────────────────────────────────────────── */
.table-wrap{overflow:auto;max-height:calc(100vh - 260px);border-radius:6px;
  border:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;font-size:.78rem}
thead th{
  position:sticky;top:0;background:#f8fafc;border-bottom:1px solid #e2e8f0;
  padding:7px 10px;text-align:left;font-weight:600;color:#374151;
  white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{background:#eff6ff;color:#1a3a6b}
thead th.sorted-asc::after{content:' ↑'}
thead th.sorted-desc::after{content:' ↓'}
tbody tr{border-bottom:1px solid #f1f5f9;transition:background .1s}
tbody tr:hover{background:#f8fafc}
tbody td{padding:6px 10px;white-space:nowrap}
.td-shotid{font-family:monospace;font-size:.78rem}
.td-dl a{display:inline-flex;align-items:center;padding:2px 8px;
  border-radius:4px;background:#eff6ff;color:#1d4ed8;font-size:.72rem;
  font-weight:500;text-decoration:none;border:1px solid #bfdbfe}
.td-dl a:hover{background:#dbeafe}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;
  font-size:.7rem;font-weight:600}
.badge-good{background:#dcfce7;color:#15803d}
.badge-bad {background:#fee2e2;color:#b91c1c}
.badge-field{background:#eff6ff;color:#1e40af}
.empty-state{text-align:center;color:#94a3b8;padding:40px 20px;font-size:.85rem}
.empty-state .icon{font-size:2rem;margin-bottom:8px}

/* ── Download section ─────────────────────────────────────────────── */
#download-section{
  grid-column:1/-1;display:none;
  background:#fff;border-radius:8px;border:1px solid #e2e8f0
}
#download-section.visible{display:block}
.dl-head{background:#0d2240;color:#e2e8f0;padding:9px 16px;
  font-size:.8rem;font-weight:600;border-radius:8px 8px 0 0;
  display:flex;align-items:center;gap:10px}
.dl-head .size-est{margin-left:auto;font-weight:400;color:#93c5fd;font-size:.75rem}
.dl-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dl-buttons{display:flex;gap:8px;flex-wrap:wrap}
.code-block{
  background:#1e293b;color:#e2e8f0;padding:10px 14px;border-radius:6px;
  font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;
  font-size:.75rem;overflow-x:auto;line-height:1.6;position:relative}
.code-block .comment{color:#64748b}
.code-block .cmd{color:#bae6fd}
.copy-icon{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.1);
  border:none;color:#94a3b8;padding:3px 8px;border-radius:4px;cursor:pointer;
  font-size:.7rem}
.copy-icon:hover{background:rgba(255,255,255,.2);color:#e2e8f0}
#copy-toast{
  display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#1e293b;color:#e2e8f0;padding:6px 16px;border-radius:20px;
  font-size:.8rem;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.3)}
</style>

<body>

<header class="site-header">
  <div class="logo">HETDEX <span>PDR1</span></div>
  <div id="status-pill"><span class="dot spin"></span><span id="status-text">Loading data…</span></div>
  <div class="subtitle">Hobby-Eberly Telescope Dark Energy Experiment · Public Data Release 1</div>
</header>
<div id="progress-bar-wrap"><div id="progress-bar"></div></div>

<div class="app">

  <!-- ── Query panel ──────────────────────────────────────────────── -->
  <div class="card" id="query-card">
    <div class="card-head">Search</div>
    <div class="card-body">
      <div class="tabs">
        <button class="tab active" data-tab="single">Single Coordinate</button>
        <button class="tab" data-tab="catalog">Catalog (RA/Dec list)</button>
      </div>

      <!-- Single coordinate tab -->
      <div id="tab-single">
        <div class="form-row">
          <div class="form-group">
            <label>RA (degrees)
              <span class="example-link" onclick="loadExample()">Example</span>
            </label>
            <input type="number" id="inp-ra" placeholder="e.g. 228.78581"
              step="any" min="0" max="360">
          </div>
          <div class="form-group">
            <label>Dec (degrees)</label>
            <input type="number" id="inp-dec" placeholder="e.g. 51.268036"
              step="any" min="-90" max="90">
          </div>
        </div>
        <div class="form-group">
          <label>Search radius</label>
          <div class="range-row">
            <input type="range" id="inp-radius" min="5" max="120" value="37"
              oninput="document.getElementById('radius-val').textContent=this.value+'″'">
            <span class="range-val" id="radius-val">37″</span>
          </div>
          <div class="hint">37″ = IFU diameter (default). Increase to find nearby cubes.</div>
        </div>
        <button class="btn btn-primary btn-full" id="btn-search-single"
          onclick="doSingleSearch()" disabled>
          Search
        </button>
      </div>

      <!-- Catalog tab -->
      <div id="tab-catalog" style="display:none">
        <div class="form-group">
          <label>Paste RA, Dec (one source per line)</label>
          <textarea id="inp-catalog"
            placeholder="228.78581  51.268036&#10;150.23189  2.363963&#10;215.68578  52.11736&#10;&#10;Accepts: space, comma, or tab separated.&#10;Lines starting with # are ignored."></textarea>
          <div id="catalog-parse-status"></div>
          <div class="hint" style="margin-top:6px">
            or upload a CSV/text file:
            <span class="file-btn-wrap">
              <button class="btn btn-secondary btn-sm" style="margin-left:4px">
                Upload file
              </button>
              <input type="file" id="inp-file" accept=".csv,.txt,.dat"
                onchange="loadCatalogFile(event)">
            </span>
          </div>
        </div>
        <button class="btn btn-primary btn-full" id="btn-search-catalog"
          onclick="doCatalogSearch()" disabled>
          Search Catalog
        </button>
      </div>
    </div>
  </div>

  <!-- ── Results panel ─────────────────────────────────────────────── -->
  <div class="card" id="results-card">
    <div class="card-head">
      Results
      <div class="filter-group" id="filter-group" style="display:none">
        <select id="filter-quality" onchange="applyFilters()">
          <option value="all">All quality</option>
          <option value="good">Good only (flag=1)</option>
        </select>
        <select id="filter-field" onchange="applyFilters()">
          <option value="all">All fields</option>
          <option value="dex-spring">dex-spring</option>
          <option value="dex-fall">dex-fall</option>
          <option value="cosmos">cosmos</option>
          <option value="goods-n">goods-n</option>
          <option value="nep">nep</option>
          <option value="ssa22">ssa22</option>
        </select>
      </div>
    </div>
    <div class="card-body">
      <div id="results-head" class="results-head" style="display:none">
        <div class="result-count" id="result-count"></div>
      </div>
      <div id="results-empty" class="empty-state">
        <div class="icon">🔭</div>
        Enter coordinates and click Search
      </div>
      <div class="table-wrap" id="table-wrap" style="display:none">
        <table id="results-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ── Download section ──────────────────────────────────────────── -->
  <div id="download-section">
    <div class="dl-head">
      Download Datacubes
      <span class="size-est" id="size-est"></span>
    </div>
    <div class="dl-body">
      <div class="dl-buttons">
        <button class="btn btn-green" onclick="downloadURLs()">
          ⬇ Download urls.txt
        </button>
        <button class="btn btn-secondary" onclick="copyURLs()">
          ⎘ Copy URLs to clipboard
        </button>
      </div>
      <div class="code-block" id="wget-block">
        <button class="copy-icon" onclick="copyWget()">copy</button>
        <span id="wget-text"></span>
      </div>
    </div>
  </div>

</div><!-- .app -->

<div id="copy-toast">Copied!</div>

<script>
// ── Configuration ───────────────────────────────────────────────────
const IFU_DATA_URL  = 'https://web.corral.tacc.utexas.edu/hetdex/HETDEX/pdr/pdr1/ifu-data.bin';
const CUBE_BASE_URL = 'https://web.corral.tacc.utexas.edu/hetdex/HETDEX/pdr/pdr1/datacubes';
const FIELD_NAMES   = ['dex-spring','dex-fall','cosmos','goods-n','nep','ssa22'];
const CUBE_SIZE_GB  = 0.019; // ~19 MB per cube

// ── Data state ──────────────────────────────────────────────────────
let N = 0;
let raArr, decArr, shotDateArr, shotObsArr, ifuslotArr, flagArr, fieldArr, fwhmArr, respArr;
let isLoaded = false;

// ── Raw results (before filters) ───────────────────────────────────
let rawResults = [];   // array of hit objects
let activeMode = 'single'; // 'single' | 'catalog'

// ── Sort state ──────────────────────────────────────────────────────
let sortCol = null, sortAsc = true;

// ── Status helpers ──────────────────────────────────────────────────
function setStatus(type, msg) {
  const pill = document.getElementById('status-pill');
  const dot  = pill.querySelector('.dot');
  document.getElementById('status-text').textContent = msg;
  pill.className = 'status-pill ' + type;
  dot.className  = 'dot' + (type === 'loading' ? ' spin' : '');
}

// ── Data loading ────────────────────────────────────────────────────
async function loadIFUData() {
  setStatus('loading', 'Loading IFU index…');
  try {
    const resp = await fetch(IFU_DATA_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} — ${IFU_DATA_URL} not found`);

    const total = parseInt(resp.headers.get('Content-Length') || '0');
    const reader = resp.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      if (total > 0) {
        const pct = Math.min(100, (received / total) * 100);
        document.getElementById('progress-bar').style.width = pct + '%';
        setStatus('loading', `Loading… ${(received/1e6).toFixed(1)} / ${(total/1e6).toFixed(1)} MB`);
      }
    }

    document.getElementById('progress-bar').style.width = '100%';

    const merged = new Uint8Array(received);
    let pos = 0;
    for (const c of chunks) { merged.set(c, pos); pos += c.length; }

    parseData(merged.buffer);
    setStatus('ready', `Ready — ${N.toLocaleString()} IFUs`);
    isLoaded = true;
    enableButtons();
    document.getElementById('progress-bar').style.width = '0';
  } catch(e) {
    setStatus('error', e.message);
    document.getElementById('results-empty').innerHTML =
      `<div class="icon">⚠️</div>
       Could not load <code>ifu-data.bin</code>.<br>
       <span style="font-size:.75rem;color:#64748b">
       Generate it with: <code>python tools/make_ifu_web_data.py ifu-index.fits ifu-data.bin</code><br>
       then upload it alongside this HTML file.</span>`;
  }
}

function parseData(buf) {
  // Verify magic
  const magic = new Uint8Array(buf, 0, 6);
  const expected = [72,69,84,68,88,49]; // "HETDX1"
  for (let i = 0; i < 6; i++) {
    if (magic[i] !== expected[i]) throw new Error('Unrecognised data file format');
  }
  const view = new DataView(buf);
  N = view.getUint32(8, true);

  let off = 16;
  raArr       = new Float32Array(buf, off, N); off += N*4;
  decArr      = new Float32Array(buf, off, N); off += N*4;
  shotDateArr = new Uint32Array (buf, off, N); off += N*4;
  shotObsArr  = new Uint16Array (buf, off, N); off += N*2;
  ifuslotArr  = new Uint16Array (buf, off, N); off += N*2;
  flagArr     = new Uint8Array  (buf, off, N); off += N;
  fieldArr    = new Uint8Array  (buf, off, N); off += N;
  fwhmArr     = new Uint8Array  (buf, off, N); off += N;
  respArr     = new Uint8Array  (buf, off, N);
}

function enableButtons() {
  document.getElementById('btn-search-single').disabled  = false;
  document.getElementById('btn-search-catalog').disabled = false;
}

// ── Spatial search helpers ──────────────────────────────────────────
function bsLower(arr, val) {
  let lo = 0, hi = arr.length;
  while (lo < hi) { const m=(lo+hi)>>>1; arr[m]<val ? lo=m+1 : hi=m; }
  return lo;
}
function bsUpper(arr, val) {
  let lo = 0, hi = arr.length;
  while (lo < hi) { const m=(lo+hi)>>>1; arr[m]<=val ? lo=m+1 : hi=m; }
  return lo;
}

function angSepArcsec(ra1, dec1, ra2, dec2) {
  const d = Math.PI/180;
  const sd = Math.sin((dec1-dec2)*d/2), sr = Math.sin((ra1-ra2)*d/2);
  const a  = sd*sd + Math.cos(dec1*d)*Math.cos(dec2*d)*sr*sr;
  return 2*Math.asin(Math.sqrt(Math.min(1,a)))*3600/d;
}

function coneSearch(ra0, dec0, rArcsec) {
  const rDeg   = rArcsec/3600;
  const start  = bsLower(decArr, dec0-rDeg);
  const end    = bsUpper(decArr, dec0+rDeg);
  const cosDec = Math.max(Math.cos(dec0*Math.PI/180), 1e-4);
  const raDelta= rDeg/cosDec * 1.05; // a little slack for RA pre-filter
  const hits   = [];
  for (let i=start; i<end; i++) {
    let dra = Math.abs(raArr[i]-ra0);
    if (dra > 180) dra = 360-dra;
    if (dra > raDelta) continue;
    const sep = angSepArcsec(raArr[i], decArr[i], ra0, dec0);
    if (sep <= rArcsec) {
      const date = shotDateArr[i];
      const obs  = shotObsArr[i];
      const shot = date*1000 + obs;
      const ifus = String(ifuslotArr[i]).padStart(3,'0');
      hits.push({
        i, sep,
        ra: raArr[i], dec: decArr[i],
        shotid: shot, ifuslot: ifus,
        flag:  flagArr[i],
        field: FIELD_NAMES[fieldArr[i]] || 'other',
        fwhm:  fwhmArr[i]/10,
        resp:  respArr[i]/100,
      });
    }
  }
  return hits;
}

// ── Catalog parsing ─────────────────────────────────────────────────
function parseCatalog(text) {
  const lines = text.split('\n');
  const sources = [];
  const errors  = [];
  for (let ln of lines) {
    ln = ln.trim();
    if (!ln || ln.startsWith('#')) continue;
    const parts = ln.split(/[\s,\t]+/).filter(Boolean);
    if (parts.length < 2) { errors.push(ln); continue; }
    const ra  = parseFloat(parts[0]);
    const dec = parseFloat(parts[1]);
    if (isNaN(ra)||isNaN(dec)||ra<0||ra>360||dec<-90||dec>90) {
      errors.push(ln); continue;
    }
    sources.push({ra, dec});
  }
  return {sources, errors};
}

function catalogConeSearch(sources, rArcsec) {
  const cubeMap = new Map();
  for (let si=0; si<sources.length; si++) {
    const {ra,dec} = sources[si];
    const hits = coneSearch(ra, dec, rArcsec);
    for (const h of hits) {
      const key = `${h.shotid}_${h.ifuslot}`;
      if (!cubeMap.has(key)) {
        cubeMap.set(key, {...h, nSrc:0, minSep:Infinity});
      }
      const entry = cubeMap.get(key);
      entry.nSrc++;
      if (h.sep < entry.minSep) entry.minSep = h.sep;
    }
  }
  return Array.from(cubeMap.values());
}

// ── Search actions ──────────────────────────────────────────────────
function doSingleSearch() {
  if (!isLoaded) return;
  const ra  = parseFloat(document.getElementById('inp-ra').value);
  const dec = parseFloat(document.getElementById('inp-dec').value);
  const r   = parseFloat(document.getElementById('inp-radius').value);
  if (isNaN(ra)||isNaN(dec)) {
    alert('Please enter valid RA and Dec values.'); return;
  }
  activeMode = 'single';
  rawResults = coneSearch(ra, dec, r);
  rawResults.sort((a,b) => a.sep - b.sep);
  applyFilters();
}

function doCatalogSearch() {
  if (!isLoaded) return;
  const text = document.getElementById('inp-catalog').value;
  const {sources, errors} = parseCatalog(text);
  if (sources.length === 0) {
    alert('No valid coordinates found. Check the format and try again.'); return;
  }
  activeMode = 'catalog';
  rawResults = catalogConeSearch(sources, 37);
  rawResults.sort((a,b) => b.nSrc - a.nSrc);
  updateParseStatus(sources.length, errors.length);
  applyFilters();
}

// ── Filters ─────────────────────────────────────────────────────────
function applyFilters() {
  const qf = document.getElementById('filter-quality').value;
  const ff = document.getElementById('filter-field').value;
  let filtered = rawResults;
  if (qf === 'good')   filtered = filtered.filter(h => h.flag === 1);
  if (ff !== 'all')    filtered = filtered.filter(h => h.field === ff);
  if (sortCol) filtered = sortBy(filtered, sortCol, sortAsc);
  renderResults(filtered);
}

function sortBy(arr, col, asc) {
  return [...arr].sort((a,b) => {
    const va = a[col], vb = b[col];
    return asc ? (va>vb?1:va<vb?-1:0) : (va<vb?1:va>vb?-1:0);
  });
}

function onHeaderClick(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('sorted-asc','sorted-desc');
    if (th.dataset.col === col) th.classList.add(sortAsc?'sorted-asc':'sorted-desc');
  });
  applyFilters();
}

// ── Rendering ───────────────────────────────────────────────────────
const MAX_ROWS = 1000;

function cubeURL(shotid, ifuslot) {
  return `${CUBE_BASE_URL}/${shotid}/dex_cube_${shotid}_${ifuslot}.fits`;
}

function renderResults(hits) {
  const isEmpty  = document.getElementById('results-empty');
  const wrap     = document.getElementById('table-wrap');
  const head     = document.getElementById('results-head');
  const fg       = document.getElementById('filter-group');
  const countEl  = document.getElementById('result-count');
  const dlSec    = document.getElementById('download-section');

  if (hits.length === 0) {
    isEmpty.style.display = '';
    wrap.style.display    = 'none';
    head.style.display    = 'none';
    fg.style.display      = 'none';
    dlSec.classList.remove('visible');
    return;
  }

  isEmpty.style.display = 'none';
  wrap.style.display    = 'block';
  head.style.display    = 'flex';
  fg.style.display      = 'flex';

  const shown = hits.length > MAX_ROWS ? MAX_ROWS : hits.length;
  countEl.innerHTML = `<span>${hits.length.toLocaleString()}</span> datacube${hits.length===1?'':'s'} found` +
    (hits.length > MAX_ROWS ? ` <span style="font-weight:400;color:#94a3b8">(showing first ${MAX_ROWS.toLocaleString()})</span>` : '');

  // Build table header
  const isCatalog = (activeMode === 'catalog');
  const cols = isCatalog
    ? [
        {label:'#',     col:null},
        {label:'Shotid',col:'shotid'},
        {label:'IFUslot',col:'ifuslot'},
        {label:'Field', col:'field'},
        {label:'Quality',col:'flag'},
        {label:'Seeing″',col:'fwhm'},
        {label:'Resp.',  col:'resp'},
        {label:'Sources',col:'nSrc'},
        {label:'',       col:null},
      ]
    : [
        {label:'#',     col:null},
        {label:'Shotid',col:'shotid'},
        {label:'IFUslot',col:'ifuslot'},
        {label:'Field', col:'field'},
        {label:'Quality',col:'flag'},
        {label:'Seeing″',col:'fwhm'},
        {label:'Resp.',  col:'resp'},
        {label:'Sep.″', col:'sep'},
        {label:'',       col:null},
      ];

  const thead = document.getElementById('table-head');
  thead.innerHTML = '<tr>' + cols.map(c =>
    `<th data-col="${c.col||''}" onclick="${c.col?`onHeaderClick('${c.col}')`:''}"
      style="${c.col?'':'cursor:default'}">${c.label}</th>`
  ).join('') + '</tr>';

  // Build rows
  const tbody = document.getElementById('table-body');
  const rows  = hits.slice(0, MAX_ROWS);
  tbody.innerHTML = rows.map((h, idx) => {
    const url = cubeURL(h.shotid, h.ifuslot);
    const flagBadge = h.flag===1
      ? `<span class="badge badge-good">good</span>`
      : `<span class="badge badge-bad">flagged</span>`;
    const fieldBadge = `<span class="badge badge-field">${h.field}</span>`;
    const fwhm = h.fwhm.toFixed(1);
    const resp = h.resp.toFixed(2);
    const lastCol = isCatalog
      ? `<td>${h.nSrc}</td>`
      : `<td>${h.sep.toFixed(1)}</td>`;
    return `<tr>
      <td>${idx+1}</td>
      <td class="td-shotid">${h.shotid}</td>
      <td>${h.ifuslot}</td>
      <td>${fieldBadge}</td>
      <td>${flagBadge}</td>
      <td>${fwhm}</td>
      <td>${resp}</td>
      ${lastCol}
      <td class="td-dl"><a href="${url}" target="_blank" rel="noopener">FITS ↗</a></td>
    </tr>`;
  }).join('');

  // Update download section
  const totalCubes = hits.length;
  const sizeGB = (totalCubes * CUBE_SIZE_GB).toFixed(1);
  document.getElementById('size-est').textContent =
    `${totalCubes.toLocaleString()} cubes · ~${sizeGB} GB`;
  buildWgetBlock(hits);
  dlSec.classList.add('visible');
}

// ── Download helpers ────────────────────────────────────────────────
function getURLs(hits) {
  return hits.map(h => cubeURL(h.shotid, h.ifuslot));
}

function buildWgetBlock(hits) {
  const n = hits.length;
  const text = `<span class="comment"># ${n.toLocaleString()} cube${n===1?'':'s'} · ~${(n*CUBE_SIZE_GB).toFixed(1)} GB</span>
<span class="comment"># Single-threaded wget (run from your pdr1 directory):</span>
<span class="cmd">wget --cut-dirs=4 -nH -x -i urls.txt</span>

<span class="comment"># Parallel download — 4 workers (recommended for large batches):</span>
<span class="cmd">cat urls.txt | xargs -n 1 -P 4 wget --cut-dirs=4 -nH -x</span>

<span class="comment"># Saves to: ./datacubes/SHOTID/dex_cube_SHOTID_IFU.fits</span>`;
  document.getElementById('wget-text').innerHTML = text;
}

function downloadURLs() {
  if (!rawResults.length) return;
  const urls    = getFilteredURLs();
  const blob    = new Blob([urls.join('\n')], {type:'text/plain'});
  const a       = document.createElement('a');
  a.href        = URL.createObjectURL(blob);
  a.download    = 'urls.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

function getFilteredURLs() {
  const qf = document.getElementById('filter-quality').value;
  const ff = document.getElementById('filter-field').value;
  let hits = rawResults;
  if (qf === 'good') hits = hits.filter(h => h.flag === 1);
  if (ff !== 'all')  hits = hits.filter(h => h.field === ff);
  return getURLs(hits);
}

function copyURLs() {
  const urls = getFilteredURLs();
  navigator.clipboard.writeText(urls.join('\n')).then(() => showToast('URLs copied!'));
}

function copyWget() {
  const qf   = document.getElementById('filter-quality').value;
  const ff   = document.getElementById('filter-field').value;
  let hits   = rawResults;
  if (qf==='good') hits = hits.filter(h=>h.flag===1);
  if (ff!=='all')  hits = hits.filter(h=>h.field===ff);
  const n    = hits.length;
  const text = `wget --cut-dirs=4 -nH -x -i urls.txt\n# OR parallel:\ncat urls.txt | xargs -n 1 -P 4 wget --cut-dirs=4 -nH -x`;
  navigator.clipboard.writeText(text).then(() => showToast('Copied!'));
}

function showToast(msg) {
  const t = document.getElementById('copy-toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display='none'; }, 2000);
}

// ── Catalog file upload ─────────────────────────────────────────────
function loadCatalogFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('inp-catalog').value = ev.target.result;
    const {sources,errors} = parseCatalog(ev.target.result);
    updateParseStatus(sources.length, errors.length);
  };
  reader.readAsText(file);
}

function updateParseStatus(n, nerr) {
  const el = document.getElementById('catalog-parse-status');
  if (nerr > 0)
    el.innerHTML = `<span class="parse-ok">✓ ${n} coordinates parsed</span>` +
      `<span class="parse-err"> · ${nerr} lines skipped</span>`;
  else
    el.innerHTML = `<span class="parse-ok">✓ ${n} coordinates parsed</span>`;
}

// Watch textarea changes for live parse count
document.getElementById('inp-catalog').addEventListener('input', function() {
  if (!this.value.trim()) {
    document.getElementById('catalog-parse-status').innerHTML = '';
    return;
  }
  const {sources,errors} = parseCatalog(this.value);
  updateParseStatus(sources.length, errors.length);
});

// ── Tab switching ───────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const t = btn.dataset.tab;
    document.getElementById('tab-single').style.display  = t==='single' ? '' : 'none';
    document.getElementById('tab-catalog').style.display = t==='catalog'? '' : 'none';
  });
});

// ── Enter key for single search ─────────────────────────────────────
['inp-ra','inp-dec'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key==='Enter') doSingleSearch();
  });
});

  document.getElementById('inp-ra').value  = '228.78581';
  document.getElementById('inp-dec').value = '51.268036';
}

loadIFUData();
